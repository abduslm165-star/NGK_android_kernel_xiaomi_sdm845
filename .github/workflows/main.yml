name: Build NGK APatch Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Clone Kernel
      run: |
        git clone https://github.com/${{ github.repository }} kernel

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential flex libssl-dev zip

    - name: Clone APatch
      run: |
        git clone https://github.com/bmax121/APatch.git
        cp -r APatch/kernel/* kernel/

    - name: Clone clang
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git

    - name: Build kernel
      run: |
        cd kernel
        export ARCH=arm64
        export PATH=$PWD/../proton-clang/bin:$PATH
        make O=out nogravity-dipper_defconfig
        make -j$(nproc) O=out CC=clang

    - name: Clone AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git

    - name: Create zip
      run: |
        cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r NGK_APatch_kernel.zip *

    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: NGK_APatch_kernel
        path: AnyKernel3/NGK_APatch_kernel.zip
